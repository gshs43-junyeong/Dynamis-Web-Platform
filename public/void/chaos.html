*{margin:0;padding:0;box-sizing:border-box;}

<body class="crt">
  <div id="screen">
    <div class="bar"><span class="t">DYNAMIS // ROOT_ACCESS</span><span class="s">● NODE :: CHAOS</span></div>
    <div id="term" aria-live="polite"></div>
  </div>
<script>
(function(){
  "use strict";
  var CFG = {"sig":"DYN-ROOT","intro":[["[ NODE :: CHAOS ]  —  혼돈","banner"],["질서는 무너지고, 마지막 전에 다다른다.","dim"]],"pixelKey":null,"keyPrompt":"> 직전 노드(TELOS)의 파편 단어를 입력하라:","blob":"bI+wU5XMegfs+R/vY1bsi+A0CHkI7YBlCs0ZQaCKdoHaQ0/xV3wlbJfLOIyardkLBoyFTAlr14w5i7zyICEQ0QfO2+uyCeiGVCoivI1dDwHhDwK3C93h4QOFOeibRDDpfoPYUpGWdgYUYXnfY4LHf437VE6My5GhxH40BkvFn6YtO2ik60yh61egUqUc90DL0BM8Ak88Hh5T4SAXi9fwgE9imiJ4ZHGHNLzb5wDod/jUrJQN4ge9IHx4KdfiPv3K4URj48BGzxH/0nA6Tg=="};
    /* 암호 계층 — 구 xorshift32 키스트림은 출력이 곧 내부 상태라
     평문 4바이트만 알면 키 없이 전량 복호화가 됐다. SHA-256 카운터 모드로 교체. */

  function sha256(bytes){
    var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var ml=bytes.length, withOne=ml+1, k=(56-withOne%64+64)%64, total=withOne+k+8;
    var m=new Uint8Array(total); m.set(bytes,0); m[ml]=0x80;
    var dv=new DataView(m.buffer), bits=ml*8;
    dv.setUint32(total-4, bits>>>0, false);
    dv.setUint32(total-8, Math.floor(bits/4294967296)>>>0, false);
    var h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,
        h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
    var w=new Uint32Array(64);
    for(var off=0;off<total;off+=64){
      for(var i=0;i<16;i++) w[i]=dv.getUint32(off+i*4,false);
      for(i=16;i<64;i++){
        var x=w[i-15], y=w[i-2];
        var s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
        var s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
      }
      var a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for(i=0;i<64;i++){
        var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
        var ch=(e&f)^(~e&g);
        var t1=(h+S1+ch+K[i]+w[i])>>>0;
        var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
        var mj=(a&b)^(a&c)^(b&c);
        var t2=(S0+mj)>>>0;
        h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
      }
      h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;
      h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;
    }
    var out=new Uint8Array(32), odv=new DataView(out.buffer), hs=[h0,h1,h2,h3,h4,h5,h6,h7];
    for(i=0;i<8;i++) odv.setUint32(i*4,hs[i],false);
    return out;
  }
  var DYN_SALT='dynamis/v2/kdf', DYN_ROUNDS=10000;
  function _u8(str){
    var esc=encodeURIComponent(str), out=[];
    for(var i=0;i<esc.length;i++){
      if(esc.charAt(i)==='%'){ out.push(parseInt(esc.substr(i+1,2),16)); i+=2; }
      else out.push(esc.charCodeAt(i));
    }
    return new Uint8Array(out);
  }
  function _cat(a,b){ var o=new Uint8Array(a.length+b.length); o.set(a,0); o.set(b,a.length); return o; }
  function _be32(n){ var o=new Uint8Array(4); new DataView(o.buffer).setUint32(0,n>>>0,false); return o; }
  var _kdfCache={};
  /* 반복 해싱으로 키를 늘려, 사전 공격 1회 시도 단가를 올린다 */
  function deriveKey(answer){
    var ck=String(answer);
    if(_kdfCache[ck]) return _kdfCache[ck];
    var d=sha256(_u8(DYN_SALT+'|'+ck));
    for(var i=0;i<DYN_ROUNDS;i++) d=sha256(_cat(d,_be32(i)));
    _kdfCache[ck]=d;
    return d;
  }
  /* SHA-256 카운터 모드 — 출력에서 내부 상태를 되돌릴 수 없다 */
  function keystream(answer,len){
    var K=deriveKey(answer), out=new Uint8Array(len), off=0, ctr=0;
    while(off<len){
      var blk=sha256(_cat(K,_be32(ctr++)));
      for(var i=0;i<32 && off<len;i++) out[off++]=blk[i];
    }
    return out;
  }
  function _xor(bytes,answer){
    var ks=keystream(answer,bytes.length), o=new Uint8Array(bytes.length);
    for(var i=0;i<bytes.length;i++) o[i]=bytes[i]^ks[i];
    return o;
  }
  /* 정답 검증 태그 — djb2(32비트) 는 사전+중간만남 공격으로 역산됐다.
     유도키 기반이라 시도 1회당 KDF 비용이 그대로 붙는다. */
  function tag(answer){
    var t=sha256(_cat(deriveKey(answer),_u8('verify')));
    var s='';
    for(var i=0;i<8;i++){ var v=t[i].toString(16); s+=(v.length<2?'0':'')+v; }
    return s;
  }
  function decrypt(b64,key){ var bin=atob(b64); var by=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(_xor(by,key)); }
  function norm(s){ return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
  function isBot(){
    try{
      if(navigator.webdriver) return true;
      if(/bot|crawl|spider|slurp|gptbot|claude|anthropic|python-requests|curl|wget|bytespider|ccbot/i.test(navigator.userAgent||'')) return true;
      if(!navigator.languages || navigator.languages.length===0) return true;
      if(window.outerWidth===0 && window.outerHeight===0) return true;
    }catch(e){ return true; }
    return false;
  }
  var term;
  function el(text,cls){ var d=document.createElement('div'); d.className='line'+(cls?(' '+cls):''); d.textContent=text; term.appendChild(d); return d; }
  function gap(){ el(' '); }
  function drawPixels(rows){
    var cv=document.createElement('canvas'); cv.className='pixelkey';
    var scale=9,pad=10; var h=rows.length,w=rows[0].length;
    cv.width=w*scale+pad*2; cv.height=h*scale+pad*2;
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#020402'; ctx.fillRect(0,0,cv.width,cv.height);
    for(var y=0;y<h;y++){ for(var x=0;x<w;x++){ if(rows[y].charAt(x)==='1'){
      var jx=(Math.random()-0.5)*1.6;
      ctx.fillStyle='rgba(124,255,107,'+(0.72+Math.random()*0.28).toFixed(3)+')';
      ctx.fillRect(pad+x*scale+jx, pad+y*scale, scale-1, scale-1);
    }}}
    var noise=Math.floor(w*h*0.14);
    for(var n=0;n<noise;n++){ ctx.fillStyle='rgba(124,255,107,'+(Math.random()*0.22).toFixed(3)+')'; ctx.fillRect(pad+Math.random()*w*scale, pad+Math.random()*h*scale, 2,2); }
    ctx.fillStyle='rgba(0,0,0,0.28)';
    for(var s=0;s<cv.height;s+=3){ ctx.fillRect(0,s,cv.width,1); }
    var box=document.createElement('div'); box.className='pixelbox'; box.appendChild(cv); term.appendChild(box);
  }
  function boot(){
    term=document.getElementById('term');
    if(isBot()){
      el('╳ 자동화된 접근이 감지되었다.','red');
      el('이 노드는 사람의 눈과 손에만 응답한다.','dim');
      el('DYNAMIS 는 기계에게 문을 열지 않는다.','dim');
      return;
    }
    CFG.intro.forEach(function(p){ el(p[0],p[1]); });
    if(CFG.pixelKey){ drawPixels(CFG.pixelKey); }
    var row=document.createElement('div'); row.className='node-inp';
    var lab=document.createElement('span'); lab.className='amber'; lab.textContent=CFG.keyPrompt;
    var inp=document.createElement('input'); inp.id='nodekey'; inp.autocomplete='off'; inp.autocapitalize='off'; inp.spellcheck=false; inp.setAttribute('aria-label','key');
    var btn=document.createElement('button'); btn.className='go'; btn.textContent='ENTER';
    row.appendChild(lab); row.appendChild(inp); row.appendChild(btn); term.appendChild(row);
    var solved=false;
    function attempt(){
      if(solved) return;
      var k=norm(inp.value);
      if(!k){ return; }
      var data=null;
      try{ data=JSON.parse(decrypt(CFG.blob,k)); }catch(e){ data=null; }
      if(data && data.sig===CFG.sig){
        solved=true; inp.disabled=true; btn.disabled=true;
        gap(); el('▓ 잠금 해제.','ok');
        el('SHARD // '+data.shard,'bright');
        gap(); data.next.forEach(function(p){ el(p[0],p[1]); });
        if(data.hiddenClue){
          var hc=document.createElement('span');
          hc.id='sys-relay-9c2e';
          hc.setAttribute('data-next-hop', atob(data.hiddenClue));
          hc.setAttribute('aria-hidden','true');
          hc.style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;';
          document.getElementById('screen').appendChild(hc);

      } else {
        el('✖ 복호화 실패. 열쇠가 틀렸다.','red');
        inp.value='';
      }
    }
    btn.addEventListener('click',attempt);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); attempt(); } });
    inp.focus();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
